name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# a new push to a pull request makes the run for the previous one moot;
# runs on master always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # npm's download cache, which the container's npm ci reuses
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-docker
          key: npm-docker-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-docker-

      - name: Run Playwright tests
        run: npm run test:pw:docker
        env:
          CI: true
          NPM_CACHE_DIR: ${{ runner.temp }}/npm-docker

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # its own runner, so nothing else skews the throttled timings
  perf:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the large-build perf spec
        run: ./node_modules/.bin/playwright test
        env:
          CI: true
          PW_PERF: 1
          # throttling is relative to the runner, which measures 270-600 ms where a laptop measures 130-180
          PERF_UPDATE_LIMIT_MS: 800
