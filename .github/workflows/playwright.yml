name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# a new push to a pull request makes the run for the previous one moot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # npm's download cache, which the container's npm ci reuses
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-docker
          key: npm-docker-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-docker-

      - name: Run Playwright tests
        run: npm run test:pw:docker
        env:
          CI: true
          NPM_CACHE_DIR: ${{ runner.temp }}/npm-docker

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # its own runner, so nothing else skews the throttled timings
  perf:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the large-build perf spec
        run: ./node_modules/.bin/playwright test
        env:
          CI: true
          PW_PERF: 1
          # throttling is relative to the runner, which measures 270-600 ms where a laptop measures 130-180
          PERF_UPDATE_LIMIT_MS: 800
