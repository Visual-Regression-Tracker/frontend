version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # the Node major moves by hand, with .nvmrc and the Dockerfile
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # one PR for all minor/patch bumps
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # majors are batched separately since they usually need code changes
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
      # security fixes (mostly transitive deps) in a single PR too
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
