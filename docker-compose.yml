version: "3.8"
services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:8080"
      - "443:443"
    volumes:
      - ./secrets:/etc/nginx/secrets
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_OIDC_AUTO_REDIRECT: ${REACT_APP_OIDC_AUTO_REDIRECT}
      VRT_VERSION: ${VRT_VERSION}
