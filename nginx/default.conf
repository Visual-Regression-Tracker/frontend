server {
  listen 8080;

  if ($request_uri ~ "\.\./"){
    return 403;
  }

  # Screenshots, baselines and diffs. Their names are unique per upload and the
  # bytes behind a name are never rewritten, so the browser may keep them: going
  # back to a screen already reviewed then costs no request at all.
  #
  # This must not fall through to index.html the way the SPA route below does —
  # a missing image would be answered with the app's HTML and then cached under
  # the image's name for a year.
  location /static/imageUploads/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri$args $uri$args/ $uri $uri/ /index.html =404;
  }
}